<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190" viewBox="0 0 860 190" role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><title>Following the user through interface states</title><desc>A highlighted action moves the user through successive interface states, showing where information and interactions connect.</desc><style>@media(prefers-reduced-motion:reduce){.motion{display:none!important}}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8b98a8"/></marker></defs><rect width="860" height="190" fill="#0d1117"/><g fill="none" stroke="#e6edf3" stroke-width="1.5"><rect x="40" y="25" width="190" height="113" rx="3"/><path d="M40 45h190"/></g><path d="M56 61h70M56 73h109" stroke="#8b98a8" stroke-width="2"/><rect x="56" y="91" width="110" height="28" rx="3" fill="#17263d" stroke="#8db1ff"/><rect class="motion" x="56" y="91" width="110" height="28" rx="3" fill="#8db1ff" opacity="0"><animate attributeName="opacity" values="0;.22;.22;0;0" keyTimes="0;.02;.2;.25;1" dur="9s" begin="0.0s" repeatCount="indefinite"/></rect><g fill="none" stroke="#e6edf3" stroke-width="1.5"><rect x="330" y="25" width="190" height="113" rx="3"/><path d="M330 45h190"/></g><path d="M346 61h70M346 73h109" stroke="#8b98a8" stroke-width="2"/><rect x="346" y="91" width="110" height="28" rx="3" fill="#17263d" stroke="#8db1ff"/><rect class="motion" x="346" y="91" width="110" height="28" rx="3" fill="#8db1ff" opacity="0"><animate attributeName="opacity" values="0;.22;.22;0;0" keyTimes="0;.02;.2;.25;1" dur="9s" begin="0.9s" repeatCount="indefinite"/></rect><g fill="none" stroke="#e6edf3" stroke-width="1.5"><rect x="620" y="25" width="190" height="113" rx="3"/><path d="M620 45h190"/></g><path d="M636 61h70M636 73h109" stroke="#8b98a8" stroke-width="2"/><rect x="636" y="91" width="110" height="28" rx="3" fill="#17263d" stroke="#8db1ff"/><rect class="motion" x="636" y="91" width="110" height="28" rx="3" fill="#8db1ff" opacity="0"><animate attributeName="opacity" values="0;.22;.22;0;0" keyTimes="0;.02;.2;.25;1" dur="9s" begin="1.8s" repeatCount="indefinite"/></rect><path d="M246 82H312" fill="none" stroke="#8b98a8" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M536 82H602" fill="none" stroke="#8b98a8" stroke-width="1.5" marker-end="url(#arrow)"/><circle class="motion" r="4" fill="#8db1ff" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.28;.32;1" dur="9s" begin="0s" repeatCount="indefinite"/><animateMotion path="M166 105L280 105L280 82L425 82L425 105L571 105L571 82L715 82L715 105" keyPoints="0;1;1" keyTimes="0;.3;1" calcMode="linear" dur="9s" begin="0s" repeatCount="indefinite"/></circle><text x="135" y="169" fill="#a6b2c0" font-size="17" text-anchor="middle">Entry point</text><text x="425" y="169" fill="#a6b2c0" font-size="17" text-anchor="middle">User action</text><text x="715" y="169" fill="#a6b2c0" font-size="17" text-anchor="middle">Next state</text></svg>