<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eden Chang · Design &amp; product</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f0f2f5; color: #18181b; font: 16px/1.75 system-ui, sans-serif; }
  main { max-width: 920px; margin: 24px auto; padding: 30px; background: white; border: 1px solid #dce0e5; border-radius: 6px; }
  img { display: block; max-width: 100%; height: auto; }
  .cover, .practice { width: 100%; }
  .intro { margin: 30px 0 36px; }
  h3 { font-size: 20px; line-height: 1.5; margin: 0 0 12px; }
  p { margin: 8px 0; }
  .work { margin: 30px 0 36px; }
  ul { padding-left: 22px; }
  li { margin: 12px 0; }
  a { color: #2563eb; text-underline-offset: 4px; }
  a:focus-visible, summary:focus-visible { outline: 2px solid #2563eb; outline-offset: 4px; }
  hr { height: 1px; border: 0; background: #dce0e5; margin: 30px 0; }
  summary { cursor: pointer; color: #46515f; min-height: 44px; }
  details img { margin-top: 16px; }
  @media (prefers-color-scheme: dark) {
    body { background: #010409; color: #e6edf3; }
    main { background: #0d1117; border-color: #30363d; }
    a { color: #82aaff; } summary { color: #b1bac4; }
  }
  @media (max-width: 600px) { main { margin: 8px; padding: 18px; } h3 { font-size: 18px; } }

<main>

  </picture>
  <section class="intro">
    <h3>Tech Product Manager</h3>
    <p>從<strong>工業設計</strong>出發，關注人如何理解、使用與體驗產品。<br>
    擅長 <strong>UI/UX 分析、系統規劃與流程設計</strong>，讓產品體驗與背後的系統邏輯彼此對齊。</p>
  </section>
  <picture>
    <source media="(prefers-color-scheme: dark)" srcset="assets/design-practice-dark.svg">
    <source media="(prefers-color-scheme: light)" srcset="assets/design-practice.svg">

    <ul>
      <li><strong>UI/UX 分析</strong> — 從使用情境、資訊層級與互動細節，找出體驗中的問題。</li>
      <li><strong>系統規劃</strong> — 釐清需求、功能與相依關係，建立清楚的產品結構。</li>
      <li><strong>流程設計</strong> — 串起使用者旅程與系統行為，讓每個步驟有合理的目的。</li>
    </ul>
  </section>
