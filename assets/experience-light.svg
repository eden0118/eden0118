<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">How an idea takes shape</title><desc id="desc">Understand the situation: Start with what someone is trying to do, what they already know, and where they need help. Different roles often need different paths through the same information. Work through the awkward parts: Missing information, permissions and interrupted steps all affect the experience. I use workflows and diagrams to make those decisions explicit. Give the idea a form: Prototypes make a proposed experience easier to examine. They help me spot gaps, reconsider the scope and work through practical constraints.</desc><rect width="980" height="520" rx="12" fill="#f8f9fd"/><text x="32" y="42" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="start">How an idea takes shape</text><path d="M48 92H932" stroke="#d4dbe8"/><circle cx="40" cy="92" r="5" fill="#146b68"/><g transform="translate(56,130) scale(0.72)" fill="none" stroke="#6750a4" stroke-width="2" stroke-linejoin="round"><path d="M0 18h26v22H0zM70 0h28v22H70zM130 43h26v22h-26zM22 68h30v22H22zM26 29 70 11M84 22l46 32M52 79l78-25"/><circle cx="84" cy="11" r="29" stroke="#146b68"/><path d="m105 32 23 23" stroke="#146b68"/></g><text x="32" y="246" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="start">Understand the situation</text><text x="32" y="279" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Start with what someone is</text><text x="32" y="307" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">trying to do, what they</text><text x="32" y="335" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">already know, and where they</text><text x="32" y="363" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">need help. Different roles</text><text x="32" y="391" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">often need different paths</text><text x="32" y="419" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">through the same</text><text x="32" y="447" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">information.</text><circle cx="356" cy="92" r="5" fill="#146b68"/><g transform="translate(372,130) scale(0.72)" fill="none" stroke="#6750a4" stroke-width="2" stroke-linejoin="round"><path d="M0 34h36v26H0zM72 0h42v26H72zM72 68h42v26H72zM36 47h18V13h18M54 47v34h18M114 13h36v68h-36"/><path d="M8 47h20M80 13h26M80 81h26" stroke="#146b68"/></g><text x="348" y="246" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="start">Work through the awkward</text><text x="348" y="274" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="start">parts</text><text x="348" y="307" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Missing information,</text><text x="348" y="335" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">permissions and interrupted</text><text x="348" y="363" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">steps all affect the</text><text x="348" y="391" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">experience. I use workflows</text><text x="348" y="419" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">and diagrams to make those</text><text x="348" y="447" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">decisions explicit.</text><circle cx="672" cy="92" r="5" fill="#146b68"/><g transform="translate(688,130) scale(0.72)" fill="none" stroke="#6750a4" stroke-width="2" stroke-linejoin="round"><rect x="0" y="0" width="126" height="84" rx="4"/><path d="M0 20h126M9 10h4m6 0h4m6 0h4M14 34h40v36H14zM66 36h43M66 48h34M66 60h24"/><path d="m104 64 4 30 9-9 14-1zM147 14V0h-14M147 0c26 22 25 60-2 83" stroke="#146b68"/></g><text x="664" y="246" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="start">Give the idea a form</text><text x="664" y="279" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Prototypes make a proposed</text><text x="664" y="307" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">experience easier to</text><text x="664" y="335" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">examine. They help me spot</text><text x="664" y="363" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">gaps, reconsider the scope</text><text x="664" y="391" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">and work through practical</text><text x="664" y="419" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">constraints.</text></svg>