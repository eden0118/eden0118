<svg xmlns="http://www.w3.org/2000/svg" width="980" height="424" viewBox="0 0 980 424" role="img" aria-labelledby="title desc"><title id="title">How an idea takes shape</title><desc id="desc">Notice the friction: Repeated workarounds and scattered information make me curious. I look at who needs help and where the task gets difficult. Make the plan clear: I clarify scope, permissions and exceptions, then use workflows and UML to make the plan easier to discuss. Try the idea: Prototypes help me spot gaps and revisit the scope. System integration and AWS experience inform the practical side.</desc><rect width="980" height="424" rx="12" fill="#f8f9fd"/><text x="32" y="42" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="start">How an idea takes shape</text><path d="M48 92H932" stroke="#d4dbe8"/><circle cx="40" cy="92" r="5" fill="#146b68"/><g transform="translate(56,130) scale(0.72)" fill="none" stroke="#6750a4" stroke-width="2" stroke-linejoin="round"><path d="M0 18h26v22H0zM70 0h28v22H70zM130 43h26v22h-26zM22 68h30v22H22zM26 29 70 11M84 22l46 32M52 79l78-25"/><circle cx="84" cy="11" r="29" stroke="#146b68"/><path d="m105 32 23 23" stroke="#146b68"/></g><text x="32" y="246" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" text-anchor="start">Notice the friction</text><text x="32" y="279" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Repeated workarounds and</text><text x="32" y="305" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">scattered information make me</text><text x="32" y="331" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">curious. I look at who needs</text><text x="32" y="357" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start"