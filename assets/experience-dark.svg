<svg xmlns="http://www.w3.org/2000/svg" width="980" height="722" viewBox="0 0 980 722" role="img" aria-labelledby="title desc"><title id="title">How an idea takes shape</title><desc id="desc">What catches my attention: A workaround people repeat every day, information they keep asking for, or a task that means switching between tools. I start by understanding what they need to accomplish and where the process gets in the way. What goes into the plan: The main workflow is only part of it. I also work through permissions, missing information and interrupted steps, using requirements, UML and architecture diagrams to make the decisions clear enough to discuss. Why I make prototypes: Some questions are easier to answer when there is something to try. Prototypes help me spot gaps and reconsider the scope; experience with system integration and AWS deployment informs the practical side of the plan.</desc><rect width="980" height="722" rx="16" fill="#090f1c"/><text x="32" y="43" fill="#dde7f5" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="24" text-anchor="start" font-weight="600" >How an idea takes shape</text><text x="32" y="68" fill="#8e9eb5" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" text-anchor="start" font-weight="400" >observe / map / explore</text><rect x="724" y="29" width="20" height="6" fill="#a99aee" opacity="0.35"/><rect x="736" y="39" width="8" height="6" fill="#22d3ee" opacity="0.55"/><rect x="748" y="49" width="8" height="6" fill="#22d3ee" opacity="0.75"/><rect x="760" y="29" width="8" height="6" fill="#a99aee" opacity="0.9500000000000001"/><rect x="772" y="39" width="20" height="6" fill="#22d3ee" opacity="0.35"/><rect x="784" y="49" width="8" height="6" fill="#22d3ee" opacity="0.55"/><rect x="796" y="29" width="8" height="6" fill="#a99aee" opacity="0.75"/><rect x="808" y="39" width="8" height="6" fill="#22d3ee" opacity="0.9500000000000001"/><rect x="820" y="49" width=