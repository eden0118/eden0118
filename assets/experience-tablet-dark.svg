<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740" role="img" aria-labelledby="title desc"><title id="title">How an idea takes shape</title><desc id="desc">Notice the friction: Repeated workarounds and scattered information make me curious. I look at who needs help and where the task gets difficult. Make the plan clear: I clarify scope, permissions and exceptions, then use workflows and UML to make the plan easier to discuss. Try the idea: Prototypes help me spot gaps and revisit the scope. System integration and AWS experience inform the practical side.</desc><rect width="600" height="740" rx="12" fill="#0d1117"/><text x="24" y="42" fill="#ecf1fa" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="start">How an idea takes shape</text><path d="M24 78H576" stroke="#303b4c"/><g transform="translate(524,88) scale(0.28)" fill="none" stroke="#c2b4ff" stroke-width="2" stroke-linejoin="round"><path d="M0 18h26v22H0zM70 0h28v22H70zM130 43h26v22h-26zM22 68h30v22H22zM26 29 70 11M84 22l46 32M52 79l78-25"/><circle cx="84" cy="11" r="29" stroke="#81d8d0"/><path d="m105 32 23 23" stroke="#81d8d0"/></g><text x="24" y="120" fill="#ecf1fa" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="start">Notice the friction</text><text x="24" y="158" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">Repeated workarounds and scattered</text><text x="24" y="192" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">information make me curious. I look at who</text><text x="24" y="226" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">needs help and where the task gets</text><text x="24" y="260" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">difficult.</text><path d="M24 314H576" stroke="#303b4c"/><g transform="translate(524,324) scale(0.28)" fill="none" stroke="#c2b4ff" stroke-width="2" stroke-linejoin="round"><path d="M0 34h36v26H0zM72 0h42v26H72zM72 68h42v26H72zM36 47h18V13h18M54 47v34h18M114 13h36v68h-36"/><path d="M8 47h20M80 13h26M80 81h26" stroke="#81d8d0"/></g><text x="24" y="356" fill="#ecf1fa" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="start">Make the plan clear</text><text x="24" y="394" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">I clarify scope, permissions and</text><text x="24" y="428" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">exceptions, then use workflows and UML to</text><text x="24" y="462" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">make the plan easier to discuss.</text><path d="M24 516H576" stroke="#303b4c"/><g transform="translate(524,526) scale(0.28)" fill="none" stroke="#c2b4ff" stroke-width="2" stroke-linejoin="round"><rect x="0" y="0" width="126" height="84" rx="4"/><path d="M0 20h126M9 10h4m6 0h4m6 0h4M14 34h40v36H14zM66 36h43M66 48h34M66 60h24"/><path d="m104 64 4 30 9-9 14-1zM147 14V0h-14M147 0c26 22 25 60-2 83" stroke="#81d8d0"/></g><text x="24" y="558" fill="#ecf1fa" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="start">Try the idea</text><text x="24" y="596" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">Prototypes help me spot gaps and revisit</text><text x="24" y="630" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">the scope. System integration and AWS</text><text x="24" y="664" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start">e