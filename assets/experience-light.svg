lp me spot gaps</text><text x="664" y="305" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">and revisit the scope. System</text><text x="664" y="331" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">integration and AWS experience</text><text x="664" y="357" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">inform the practical side.</text></svg>