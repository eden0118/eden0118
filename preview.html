<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eden · GitHub profile preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1117; color: #e6edf3; font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 920px; margin: 24px auto; padding: 24px; border: 1px solid #30363d; border-radius: 6px; text-align: center; }
  h3 { margin: 24px 0 16px; font-size: 18px; }
  code { background: #161b22; border-radius: 6px; padding: 4px 8px; font: 85% ui-monospace, monospace; }
  img { max-width: 100%; height: auto; vertical-align: top; }
  .panels { display: flex; gap: 8px; }
  .panels img { width: calc(50% - 4px); }
  p { margin: 8px 0; }
  a { color: #99e1d9; }
  @media (max-width: 600px) { main { margin: 8px; padding: 16px; } .panels { flex-direction: column; } .panels img { width: 100%; } }
</style>
<main>
  <h3><code>eden@github ~ $ ./contributions.sh</code></h3>
  <img src="assets/contributions.svg" alt="Contribution calendar">
  <h3><code>eden@github ~ $ whoami</code></h3>
  <div class="panels">
    <img src="assets/portrait.svg" alt="ASCII bubble tea portrait">
    <img src="assets/stats.svg" alt="GitHub contribution statistics">
  </div>
  <h3><code>eden@github ~ $ cat about.txt</code></h3>
  <p><strong>EdenChang · Tech Product Manager</strong></p>
  <p>系統規劃 · 流程設計</p>
  <p>Turning product ideas into clear systems and thoughtful workflows.</p>
  <h3><code>eden@github ~ $ ./links.sh</code></h3>
  <a href="https://github.com/eden0118?tab=repositories">Explore my projects on GitHub</a>
</main>
</html>
