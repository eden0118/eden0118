name: Check profile art

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - 'design.png'
      - 'need-sleep.png'
      - 'working.png'
      - 'drink.png'
      - 'assets/**'
      - 'README.md'
      - 'preview.html'
      - '.github/workflows/update-profile-art.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - '*.png'
      - 'README.md'
      - 'preview.html'
      - '.github/workflows/update-profile-art.yml'

permissions:
  contents: read

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portrait dependency
        run: python -m pip install -r scripts/requirements.txt
      - name: Check committed artwork
        run: python scripts/check_art.py
      - name: Verify artwork generation
        run: python scripts/profile_art.py
      - name: Check generated artwork
        run: python scripts/check_art.py
