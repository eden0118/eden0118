<svg xmlns="http://www.w3.org/2000/svg" width="360" height="820" viewBox="0 0 360 820" role="img" aria-labelledby="title desc"><title id="title">How an idea takes shape</title><desc id="desc">Notice the friction: Repeated workarounds and scattered information make me curious. I look at who needs help and where the task gets difficult. Make the plan clear: I clarify scope, permissions and exceptions, then use workflows and UML to make the plan easier to discuss. Try the idea: Prototypes help me spot gaps and revisit the scope. System integration and AWS experience inform the practical side.</desc><rect width="360" height="820" rx="12" fill="#0d1117"/><text x="24" y="42" fill="#ecf1fa" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="start">How an idea takes shape</text><path d="M24 78H336" stroke="#303b4c"/><g transform="translate(284,88) scale(0.28)" fill="none" stroke="#c2b4ff" stroke-width="2" stroke-linejoin="round"><path d="M0 18h26v22H0zM70 0h28v22H70zM130 43h26v22h-26zM22 68h30v22H22zM26 29 70 11M84 22l46 32M52 79l78-25"/><circle cx="84" cy="11" r="29" stroke="#81d8d0"/><path d="m105 32 23 23" stroke="#81d8d0"/></g><text x="24" y="120" fill="#ecf1fa" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="start">Notice the friction</text><text x="24" y="158" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Repeated workarounds and</text><text x="24" y="188" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">scattered information make</text><text x="24" y="218" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">me curious. I look at who</text><text x="24" y="248" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">needs help and where the</text><text x="24" y="278"