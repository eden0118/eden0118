<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620" role="img" aria-labelledby="title desc"><title id="title">Eden Chang</title><desc id="desc">Hi, I&#x27;m Eden, a technical product manager. I got my start in industrial design, metalwork and exhibition planning. My work starts with everyday problems and turns them into product plans.</desc><rect width="360" height="620" rx="12" fill="#0d1117"/><text x="24" y="32" fill="#ecf1fa" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">Eden Chang</text><text x="24" y="55" fill="#adb9cc" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Technical Product Manager</text><text x="24" y="103" fill="#ecf1fa" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="600" text-anchor="start">From everyday friction</text><text x="24" y="138" fill="#ecf1fa" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="600" text-anchor="start">to something useful.</text><rect x="20" y="166" width="320" height="270" rx="6" fill="#161c26"/><g transform="translate(-14,35) scale(.8)"><g fill="#c2b4ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="5" xml:space="preserve"><text y="216"><tspan x="340">.:--=-</tspan></text><text y="221"><tspan x="331">-*#%%#%%@#.</tspan></text><text y="226"><tspan x="322">:+%%#*+*##*#@+</tspan></text><text y="231"><tspan x="316">-*%#*+==#%*++#@*</tspan></text><text y="236"><tspan x="307">:+%%#+==+*%#+=+%#%#</tspan></text><text y="241"><tspan x="295">.-+%@%*+==+*##*==*%#+%#</tspan></text><text y="246"><tspan x="232">..</tspan><tspan x="241">....</tspan><tspan x="271">..::-+*#%%#*+==+*###*==+#%*=+@=</tspan></text><text y="251"><tspan x="205">.-=+*####%%#%%%%#%###%%%%%%##*+==++*###*+==+#%*+=+%%.</tspan></text><text y="256"><tspan x="193">.-+#%@%%#****+++++++*****++++====+**####*++==+#%#++++%%:</tspan></text><text y="261"><tspan x="184">:+%%%%#*+===