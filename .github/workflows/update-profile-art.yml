name: Update profile art

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'scripts/**'
      - 'work-2.jpg'
      - 'assets/design-practice.svg'
      - '.github/workflows/update-profile-art.yml'

permissions:
  contents: write

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portrait dependency
        run: python -m pip install -r scripts/requirements.txt
      - name: Generate profile art
        run: python scripts/profile_art.py --username "${{ github.repository_owner }}" --portrait work-2.jpg
      - name: Commit refreshed art
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile art [skip ci]'
            git push
          fi
