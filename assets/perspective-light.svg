<svg xmlns="http://www.w3.org/2000/svg" width="980" height="290" viewBox="0 0 980 290" role="img" aria-labelledby="title desc"><title id="title">A design perspective</title><desc id="desc">My design background taught me to think about how something fits into a person&#x27;s surroundings and routines. That perspective now shapes how I organize information, plan interactions and work through system behavior. Design background: Industrial design, Metalwork, Exhibition planning.</desc><rect width="980" height="290" rx="12" fill="#f8f9fd"/><text x="32" y="36" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="start">A design perspective</text><text x="32" y="82" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">My design background taught me to think about</text><text x="32" y="109" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">how something fits into a person&#x27;s</text><text x="32" y="136" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">surroundings and routines.</text><text x="32" y="177" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">That perspective now shapes how I organize</text><text x="32" y="204" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">information, plan interactions and work</text><text x="32" y="231" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start">through system behavior.</text><path d="M490 32V258" stroke="#d4dbe8"/><text x="524" y="36" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" text-anchor="start">Where I started</text><path d="M630 152H838" stroke="#d4dbe8"/><text x="630" y="107" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Form</text><circle cx="630" cy="152" r="24" fill="#eef1f8" stroke="#6750a4"/><path transform="translate(630,152)" d="M-11-6 0-12 11-6v13L0 13-11 7zM-11-6 0 0 11-6M0 0v13" fill="none" stroke="#6750a4" stroke-width="1.5"/><text x="630" y="198" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Industrial</text><text x="630" y="217" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">design</text><text x="734" y="107" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Material</text><circle cx="734" cy="152" r="24" fill="#eef1f8" stroke="#6750a4"/><path transform="translate(734,152)" d="M-12-11h24v8h-24zM-3-3h6v18h-6z" fill="none" stroke="#6750a4" stroke-width="1.5"/><text x="734" y="198" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Metalwork</text><text x="838" y="107" fill="#52627b" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Space</text><circle cx="838" cy="152" r="24" fill="#eef1f8" stroke="#6750a4"/><path transform="translate(838,152)" d="M-14-10-5-14v25l-9 4zM-2-14h8v25h-8zM9-14l8 4v25l-8-4z" fill="none" stroke="#6750a4" stroke-width="1.5"/><text x="838" y="198" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">Exhibition</text><text x="838" y="217" fill="#202b40" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="middle">planning</text></svg>